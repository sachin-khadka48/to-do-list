<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlowTasks</title>
    <link href="https://fonts.googleapis.com/css?family=Segoe+UI:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #faf4ec;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header-bar {
            background: #f7c087;
            height: 8px;
            width: 100%;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #faf4ec;
            border-radius: 16px;
            padding: 32px 32px 24px 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        .title {
            font-size: 2rem;
            font-weight: bold;
            color: #e67c1e;
            display: inline;
        }
        .title-black {
            color: #222;
            font-weight: 400;
        }
        .date-section {
            margin-top: 18px;
            margin-bottom: 10px;
        }
        .day {
            color: #b87c3b;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .date {
            font-size: 1.6rem;
            font-weight: bold;
            color: #222;
        }
        .progress-label {
            color: #b87c3b;
            font-size: 1rem;
            margin-top: 18px;
        }
        .progress-bar-bg {
            background: #f7e2c6;
            border-radius: 6px;
            height: 6px;
            width: 100%;
            margin-top: 6px;
            margin-bottom: 18px;
        }
        .progress-bar {
            background: #e67c1e;
            height: 6px;
            border-radius: 6px;
            width: 40%; /* Set dynamically with JS */
        }
        .task-input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .task-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #222;
            color: #fff;
            font-size: 1.1rem;
        }
        .add-btn {
            background: #f7e2c6;
            color: #b87c3b;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            padding: 0 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover {
            background: #e67c1e;
            color: #fff;
        }
        .filter-row {
            margin-bottom: 18px;
        }
        .filter-btn {
            background: #fff;
            color: #b87c3b;
            border: none;
            border-radius: 20px;
            padding: 6px 18px;
            margin-right: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #e67c1e;
            color: #fff;
        }
        .tasks-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            background: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .task-title.completed {
            text-decoration: line-through;
            color: #a0aec0;
        }
        .task-actions button {
            background: none;
            border: none;
            color: #e67c1e;
            font-size: 1rem;
            margin-left: 10px;
            cursor: pointer;
        }
        .task-actions button:hover {
            color: #b87c3b;
        }
    </style>
</head>
<body>
    <div class="header-bar"></div>
    <div class="container">
        <span class="title">Flow</span><span class="title title-black">Tasks</span>
        <div class="date-section">
            <div class="day" id="day"></div>
            <div class="date" id="date"></div>
        </div>
        <div class="progress-label" id="progress-label">Today's progress</div>
        <div class="progress-bar-bg">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <form class="task-input-row" id="add-task-form" autocomplete="off">
            <input class="task-input" type="text" id="task-input" placeholder="Add a new task..." required>
            <button class="add-btn" type="submit">Add</button>
        </form>
        <div class="filter-row">
            <button class="filter-btn active" type="button">All</button>
            <button class="filter-btn" type="button">Active</button>
            <button class="filter-btn" type="button">Done</button>
            <button class="filter-btn" type="button">Work</button>
            <button class="filter-btn" type="button">Personal</button>
            <button class="filter-btn" type="button">Health</button>
            <button class="filter-btn" type="button">Study</button>
        </div>
        <ul class="tasks-list" id="tasks-list">
            <!-- Tasks will be rendered here -->
        </ul>
    </div>
    <script>
        // Set date
        const days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
        const now = new Date();
        document.getElementById('day').textContent = days[now.getDay()];
        document.getElementById('date').textContent = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

        // Simple in-memory tasks for demo (replace with backend integration)
        let tasks = [
            {title: "Work", completed: true},
            {title: "Personal", completed: false},
            {title: "Health", completed: true},
            {title: "Study", completed: false},
            {title: "Read a book", completed: false}
        ];

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            let completed = 0;
            tasks.forEach((task, idx) => {
                if (task.completed) completed++;
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <span class="task-title${task.completed ? ' completed' : ''}">${task.title}</span>
                    <span class="task-actions">
                        <button onclick="toggleComplete(${idx})">${task.completed ? 'Undo' : 'Done'}</button>
                        <button onclick="deleteTask(${idx})">Delete</button>
                    </span>
                `;
                list.appendChild(li);
            });
            // Progress
            document.getElementById('progress-label').textContent = `Today's progress    ${completed} / ${tasks.length} done`;
            document.getElementById('progress-bar').style.width = (tasks.length ? (completed / tasks.length * 100) : 0) + "%";
        }

        function toggleComplete(idx) {
            tasks[idx].completed = !tasks[idx].completed;
            renderTasks();
        }

        function deleteTask(idx) {
            tasks.splice(idx, 1);
            renderTasks();
        }

        document.getElementById('add-task-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const val = document.getElementById('task-input').value.trim();
            if (val) {
                tasks.push({title: val, completed: false});
                document.getElementById('task-input').value = '';
                renderTasks();
            }
        });

        renderTasks();
    </script>
</body>
</html>
